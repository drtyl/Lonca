<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lonca</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ÜST ÇUBUK: içeriği moda göre değişir -->
<header id="ust">
  <button id="geriBtn" class="ikonBtn gizli" aria-label="Geri"></button>
  <div id="baslik">
    <span class="logo">Lonca</span>
    <span id="baslikYazi">Ev</span>
    <span id="ruhRozet" class="gizli"></span>
  </div>
  <button id="eylemBtn" class="ikonBtn gizli" aria-label="Eylem"></button>
  <button id="menuBtn" class="ikonBtn" aria-label="Menü"></button>
</header>

<!-- GÖVDE: class="mod-ev | mod-sohbet | mod-sesli | mod-sayfa" -->
<main id="govde" class="mod-ev">
  <div id="sahneKap">
    <div id="etiketler"></div>
  </div>
  <div id="portre" aria-label="Karakter"><div class="portreIc"><img alt=""></div></div>
  <div id="balon" class="gizli"><span id="balonYazi"></span></div>
  <div id="ipucu">Bir karaktere dokun: seçersin · yere dokun: yürür · iki kez: koşar · iki parmak: yakınlaştır</div>

  <section id="mesajlar" aria-live="polite">
    <div id="mesajListe"></div>
    <div id="yaziyor" class="gizli"><i></i><i></i><i></i> <span></span></div>
  </section>

  <section id="sesliPanel">
    <div id="dalga"></div>
    <div id="sesliDurum">Hazırlanıyor…</div>
    <div id="sesliKismi"></div>
    <button id="sesliMik" class="buyukMik" aria-label="Mikrofon"></button>
    <div class="sesliAlt">
      <button id="sesliSessiz" class="yuvarlakBtn"><span></span><small>Sessize al</small></button>
      <button id="sesliBitir" class="yuvarlakBtn kirmizi"><span></span><small>Bitir</small></button>
    </div>
  </section>

  <div id="sayfaKap">
    <iframe id="sayfaIframe" sandbox="allow-scripts allow-forms allow-modals" title="Sayfa"></iframe>
  </div>
</main>

<!-- GİRİŞ ÇUBUĞU (ev ve sohbet modlarında) -->
<form id="giris" autocomplete="off">
  <input id="mesaj" placeholder="Nova'ya yaz…" maxlength="1000" enterkeyhint="send">
  <button id="mikBtn" type="button" class="ikonBtn yuvarlak" aria-label="Sesli konuş"></button>
  <button id="gonderBtn" type="submit" class="ikonBtn" aria-label="Gönder"></button>
</form>

<!-- SAĞDAN AÇILAN PANEL -->
<div id="perde" class="gizli"></div>
<aside id="panel" aria-hidden="true">
  <nav id="sekmeler">
    <button data-sekme="lab" class="aktif">Laboratuvar</button>
    <button data-sekme="atolye">Atölye</button>
    <button data-sekme="ayarlar">Ayarlar</button>
  </nav>
  <section id="sekme-lab" class="sekme aktif"></section>
  <section id="sekme-atolye" class="sekme"></section>
  <section id="sekme-ayarlar" class="sekme"></section>
</aside>

<!-- DOSYA DÜZENLEYİCİ (Laboratuvar) -->
<div id="editor" class="gizli">
  <div class="pencereUst">
    <button id="editorKapat" class="ikonBtn" aria-label="Kapat"></button>
    <span id="editorBaslik"></span>
    <button id="editorKaydet" class="kucukBtn vurgu">Kaydet</button>
  </div>
  <div id="editorGovde"></div>
  <div id="editorAlt"></div>
</div>

<!-- ÖNİZLEME (Laboratuvar / Atölye) -->
<div id="onizleme" class="gizli">
  <div class="pencereUst">
    <button id="onizlemeKapat" class="ikonBtn" aria-label="Kapat"></button>
    <span id="onizlemeBaslik">Önizleme</span>
  </div>
  <iframe id="onizlemeIframe" sandbox="allow-scripts allow-forms allow-modals" title="Önizleme"></iframe>
</div>

<div id="bildirim" class="gizli"></div>

<script src="js/vendor.js"></script>
<script src="js/baslat.js"></script>
</body>
</html>
